spring.application.name=price-service
server.port=${SERVER_PORT:8080}

spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.type.descriptor.sql=trace

#logging.level.org.springframework=DEBUG

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Rate limiting (token bucket per IP on /prices)
ratelimit.enabled=true
ratelimit.capacity=5
ratelimit.refill-tokens=5
ratelimit.refill-period-seconds=1

# Actuator / observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Cache (in-memory Caffeine)
spring.cache.type=caffeine
spring.cache.cache-names=applicablePrices
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m
